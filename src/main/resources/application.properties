# ============================================================
# 配置说明：本地开发（IDEA 直接跑）不用动这个文件，默认值就是本地环境
# 服务器部署时用环境变量覆盖即可，不用改代码也不用改配置，例如 Linux：
#   DB_URL="jdbc:mysql://127.0.0.1:3306/starwhisper?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai" \
#   DB_USERNAME=starwhisper DB_PASSWORD=xxx SERVER_PORT=8080 java -jar starwhisper-server.jar
# ============================================================

# 服务端口
server.port=${SERVER_PORT:8080}

# 数据库连接（默认本地 MySQL starwhisper 库）
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/starwhisper?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA：启动时自动更新表结构（开发期用 update 最省心）
spring.jpa.hibernate.ddl-auto=update

# 关闭 Open Session in View：事务结束后不再保持数据库连接，避免懒加载在 Controller 层"偷偷"生效带来的隐患
spring.jpa.open-in-view=false

# 万维易源 ShowAPI 星座运势数据源（apiCode 872）
# 到 showapi.com 控制台获取 appKey，免费档 100 次/天；留空则不调用真实接口，全部走本地生成
# 服务器部署建议用 SHOWAPI_APPKEY 环境变量注入，别把密钥写进服务器上的配置文件
showapi.appKey=${SHOWAPI_APPKEY:***REMOVED***}
# 模拟模式：true 时不发 HTTP 请求，返回本地编的"以假乱真"数据（前端联调专用），source 仍标记为 SHOWAPI
showapi.mock=false

# 微信小程序登录：到小程序后台 mp.weixin.qq.com 获取 appid 和 secret
# 留空时微信登录不可用（调 /api/auth/wechat 会报"微信登录未配置"），开发期走下面的 dev 登录
wechat.appid=${WECHAT_APPID:wx50a8622a0553d973}
wechat.secret=${WECHAT_SECRET:***REMOVED***}
# 开发期免微信登录通道（POST /api/auth/dev 直接发 token），上线必须设为 false
app.dev-login=${APP_DEV_LOGIN:true}

# 每日运势定时预热（默认每天 07:05，上海时区）
# 意义：ShowAPI 每天 1/7/17 点更新数据，7 点后预热拉到的就是当天最新；
# 12 星座 = 12 次接口配额，提前落库后用户访问直接读库秒回
app.prewarm-cron=${APP_PREWARM_CRON:0 5 7 * * *}

# 服务端口
server.port=8080

# 数据库连接（本地 MySQL，starwhisper 库）
spring.datasource.url=jdbc:mysql://localhost:3306/starwhisper?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=

# JPA：启动时自动更新表结构（开发期用 update 最省心）
spring.jpa.hibernate.ddl-auto=update

# 关闭 Open Session in View：事务结束后不再保持数据库连接，避免懒加载在 Controller 层"偷偷"生效带来的隐患
spring.jpa.open-in-view=false

# 万维易源 ShowAPI 星座运势数据源（apiCode 872）
# 到 showapi.com 控制台获取 appKey，免费档 100 次/天；留空则不调用真实接口，全部走本地生成
# 注意：这是密钥，若项目推送到公开仓库请改用环境变量 ${SHOWAPI_APPKEY:} 注入
showapi.appKey=9e32A44C4a424d8799FF074D1FD4F853
# 模拟模式：true 时不发 HTTP 请求，返回本地编的"以假乱真"数据（前端联调专用），source 仍标记为 SHOWAPI
showapi.mock=false

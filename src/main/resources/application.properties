# ============================================================
# 配置说明：
#   · 密钥一律不入库。本地开发把真实密钥写在项目根目录的
#     application-local.properties（已 gitignore，模板见 .example）；
#     服务器用环境变量注入。
#   · ⚠️ 注意 spring.config.import 是按「进程工作目录」找文件的。
#     生产部署时工作目录不要指向源码目录，否则本地密钥文件会被加载进生产。
# ============================================================

# 可选导入本地密钥文件（不入库，不存在时忽略）
spring.config.import=optional:file:./application-local.properties

# 服务端口
server.port=${SERVER_PORT:8080}

# 经 Nginx 反向代理访问：信任 X-Forwarded-For 还原真实访客 IP
# ⚠️ 前提是 8080 端口不对公网开放，否则该头可被伪造，AI 按 IP 限额会失效
server.forward-headers-strategy=framework

# ===== 数据库 =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/starwhisper?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:starwhisper}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=5000

# 表结构改由 Flyway 管理，Hibernate 只做校验（不再自动改线上表）
# 如果某台机器的库结构和实体对不上导致启动失败，把 DDL_AUTO 设成 none 先跑起来，再补迁移脚本
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
# 关闭 Open Session in View：事务结束后不再保持数据库连接
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

# ===== 数据库迁移 =====
# baseline-on-migrate：已有数据的库首次接入时，自动以 baseline-version 打底，然后只跑后续脚本
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# ===== 时区 =====
# JVM 默认时区与 cron 的 zone 必须一致，否则预热/推送会算错日期
spring.jackson.time-zone=Asia/Shanghai

# ===== 健康检查（仅暴露 health/info，不含 env/heapdump 等敏感端点）=====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.info.enabled=true

# ===== 万维易源 ShowAPI（apiCode 872）=====
# 免费档 100 次/天。留空则不调真实接口，全部走本地生成
showapi.appKey=${SHOWAPI_APPKEY:}
# 模拟模式：true 时不发 HTTP 请求，返回本地编的"以假乱真"数据（前端联调专用）
showapi.mock=false
# 每日外部调用上限（留 10 次余量给手动排查），达到后当天不再调用，直接走本地生成
showapi.daily-call-limit=${SHOWAPI_DAILY_CALL_LIMIT:90}
# 连续失败 N 次后熔断，熔断期不再调用外部接口
showapi.failure-threshold=${SHOWAPI_FAILURE_THRESHOLD:3}
showapi.cooldown-minutes=${SHOWAPI_COOLDOWN_MINUTES:30}

# ===== 微信小程序 =====
wechat.appid=${WECHAT_APPID:}
wechat.secret=${WECHAT_SECRET:}

# ===== dev 登录（免微信通道）=====
# 默认关闭。仅当同时满足「app.dev-login=true」且「请求头 X-Dev-Token 等于 app.dev-login-token」时可用。
# 只设 true 不设 token 等于关闭——这是故意的，避免只改一个开关就裸奔。
app.dev-login=${APP_DEV_LOGIN:false}
app.dev-login-token=${APP_DEV_LOGIN_TOKEN:}

# ===== 后台管理 =====
# 未配置时所有 /api/admin/** 一律 403（宁可关掉也不裸奔）。必须用 32 位以上随机串。
app.admin-key=${ADMIN_KEY:}
# 连续鉴权失败多少次后临时锁 IP
app.admin-max-failures=${ADMIN_MAX_FAILURES:5}
app.admin-lock-minutes=${ADMIN_LOCK_MINUTES:10}

# ===== Moonshot Kimi（AI 解读）=====
kimi.api-key=${KIMI_API_KEY:}
kimi.model=${KIMI_MODEL:kimi-k2.6}
kimi.per-ip-daily-limit=${KIMI_PER_IP_DAILY_LIMIT:3}
kimi.global-daily-limit=${KIMI_GLOBAL_DAILY_LIMIT:100}

# ===== 订阅消息（小程序订阅推送）=====
# 模板 ID 留空 = 推送任务直接跳过，只打日志不报错
wx.notify.dailyFortuneTemplateId=${WX_NOTIFY_DAILY_FORTUNE_TEMPLATE_ID:}
app.notify-cron=${APP_NOTIFY_CRON:0 0 8 * * *}
wx.notify.weeklyFortuneTemplateId=${WX_NOTIFY_WEEKLY_FORTUNE_TEMPLATE_ID:}
app.notify-weekly-cron=${APP_NOTIFY_WEEKLY_CRON:0 5 8 * * MON}

# ===== 定时任务 =====
# 预热任务里有 12 次 Thread.sleep(1000)，会占住一个调度线程约 12 秒，
# 池子设成 2 避免同时段的其它任务被一起堵住
spring.task.scheduling.pool.size=${SCHEDULING_POOL_SIZE:2}
# 每日运势预热（上海时区 07:05）：ShowAPI 每天 1/7/17 点更新，7 点后拉到的就是当天最新
app.prewarm-cron=${APP_PREWARM_CRON:0 5 7 * * *}
# 会话清理 + 陈旧缓存清理（每天 03:30）
app.session-cleanup-cron=${APP_SESSION_CLEANUP_CRON:0 30 3 * * *}
app.maintenance.enabled=${APP_MAINTENANCE_ENABLED:true}
